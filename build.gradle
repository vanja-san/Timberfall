plugins {
	alias(libs.plugins.fabric.loom)
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"timberfall" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// Minecraft 26.3 is shipped unobfuscated, so no mappings are configured and
	// plain `implementation` is used instead of `modImplementation`.
	minecraft libs.minecraft
	implementation libs.fabric.loader
	implementation libs.fabric.api

	testImplementation libs.junit.jupiter
	testRuntimeOnly libs.junit.platform.launcher
}

jar {
	archiveFileName = "Timberfall-v${project.version}-mc${libs.versions.minecraft.get()}-Fabric.jar"

	def archivesName = project.base.archivesName.get()
	from("LICENSE") {
		rename { "${it}_${archivesName}" }
	}
}

processResources {
	def modVersion = project.version
	inputs.property "version", modVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.test {
	useJUnitPlatform()
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
	}
}